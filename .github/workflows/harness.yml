name: Harness
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Harness
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run harness -- --model=mock --sample=5 --concurrency=3

      - name: Upload Harness Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness-runs/*

      - name: Check Pass Rate
        run: |
          latest=$(ls -t harness-runs/*.json | head -1)
          if [ -f "$latest" ]; then
            rate=$(jq -r '.summaries[0].passRate' "$latest")
            total=$(jq -r '.summaries[0].total' "$latest")
            passed=$(jq -r '.summaries[0].passed' "$latest")
            echo "📊 Harness Summary: $passed/$total ($rate%)"
            echo "PASS_RATE=$rate" >> $GITHUB_ENV
            # mock 模式下通过率仅供参考，不阻断 CI（真实 LLM 测试用 harness-live.yml）
            echo "✅ Harness ran successfully"
          else
            echo "❌ No report generated"
            exit 1
          fi
